<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT GARAGE</title>
<style>
  :root{
    --bg: #12130f;
    --panel: #1c1e18;
    --panel-2: #23261e;
    --line: #3a3d33;
    --text: #d9d6c8;
    --dim: #8a8a78;
    --amber: #f2b705;
    --rust: #b5482a;
    --good: #6fae4a;
    --bad: #c0392b;
    --repblue: #4fc3f7;
    --racegreen: #3ddc6f;

    --c-basic: #9e9e9e;
    --c-after: #4caf50;
    --c-enhanced: #2196f3;
    --c-advanced: #9c27b0;
    --c-tuned: #ff9800;
    --c-special: #f0d000;
    --c-custom: #e53935;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: radial-gradient(ellipse at 30% -10%, #23261a 0%, #0c0d0a 60%);
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 18px;
  }

  #frame{
    width: 1500px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 0 0 1px #000, 0 20px 50px rgba(0,0,0,.6);
  }

  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: linear-gradient(180deg, #24261d, #1a1c16);
    border-bottom: 2px solid var(--amber);
    padding: 12px 20px;
  }

  #topbar .brand{
    font-weight:bold;
    letter-spacing: 2px;
    color: var(--amber);
    font-size: 15px;
  }
  #topbar .brand small{
    display:block;
    color: var(--dim);
    letter-spacing: 3px;
    font-size: 9px;
    margin-top:2px;
  }

  #stats{
    display:flex;
    gap: 26px;
    font-size: 13px;
  }
  #stats .stat{ text-align:right; }
  #stats .stat .label{ color: var(--dim); font-size:10px; letter-spacing:1px; }
  #stats .stat .value{ font-size:16px; font-weight:bold; }
  #cashVal{ color: var(--good); }

  #body{
    display:flex;
    min-height: 860px;
  }

  #nav{
    width: 170px;
    background: #191b14;
    border-right: 1px solid var(--line);
    padding: 14px 0;
  }
  .navbtn{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color: var(--dim);
    font-family:inherit;
    font-size: 13px;
    padding: 14px 20px;
    cursor:pointer;
    border-left: 3px solid transparent;
    letter-spacing: 1px;
  }
  .navbtn:hover{ color: var(--text); background: #1f2118; }
  .navbtn.active{
    color: var(--amber);
    border-left: 3px solid var(--amber);
    background: #21231a;
  }

  #content{
    flex:1;
    padding: 20px 24px;
    overflow-y: auto;
    max-height: 900px;
  }

  h2.pagetitle{
    margin: 0 0 4px 0;
    font-size: 18px;
    color: var(--text);
    letter-spacing: 1px;
  }
  p.pagesub{
    margin: 0 0 18px 0;
    color: var(--dim);
    font-size: 12px;
  }

  /* --- Websites / cases --- */
  .siteRow{
    background: var(--panel-2);
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .siteHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 14px;
    background: #262920;
  }
  .siteHeadLeft{ display:flex; align-items:baseline; gap:10px; }
  .siteHeadRight{ display:flex; align-items:center; gap:10px; }
  .siteHead .name{ font-weight:bold; font-size:13px; letter-spacing:1px; }
  .siteHead .url{ color: var(--dim); font-size: 11px; }
  .repTag{ color: var(--amber); font-size:11px; letter-spacing:1px; white-space:nowrap; }
  .discountTimerTag{ color: var(--good); font-size:11px; letter-spacing:1px; white-space:nowrap; }
  .benefitsBtn{
    background:#242620; border:1px solid var(--line); color:var(--text);
    padding:5px 10px; font-family:inherit; font-size:10px; letter-spacing:1px; cursor:pointer;
  }
  .benefitsBtn:hover{ border-color: var(--amber); color: var(--amber); }

  .caseGrid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
    gap: 10px;
    padding: 14px;
  }
  .caseCard{
    background:#1a1c15;
    border:1px solid var(--line);
    padding: 10px;
    text-align:center;
    position: relative;
  }
  .caseCard .discBadge{
    position:absolute; top:6px; right:6px; text-align:right; line-height:1.35;
    color: var(--good); font-size:9.5px; font-weight:bold; letter-spacing:0.5px;
  }
  .caseCard .discBadge .leftTag{ display:block; opacity:.85; font-weight:normal; }
  .caseCard .stars{ color: var(--amber); font-size: 13px; letter-spacing:2px; margin-bottom:4px;}
  .caseCard .caseName{ font-size: 12px; margin-bottom: 8px; color:var(--text); }
  .caseCard .price{ font-size: 13px; color: var(--good); margin-bottom: 4px; }
  .caseCard .priceNote{ color: var(--dim); font-size:9px; margin-bottom:8px; }
  .caseCard .strike{ color: var(--dim); text-decoration: line-through; font-size:11px; margin-right:4px; }
  .buyBtn{
    width:100%;
    background: var(--rust);
    border:1px solid #7c2f1a;
    color:#fff;
    padding: 7px 0;
    font-family:inherit;
    font-size:11px;
    letter-spacing:1px;
    cursor:pointer;
  }
  .buyBtn:hover{ background:#cf5530; }
  .buyBtn:disabled{ background:#3a3a34; color:var(--dim); cursor:not-allowed; border-color:var(--line); }

  /* --- Inventory --- */
  .invFilters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom: 14px;
  }
  .filterBtn{
    background:#1e2019;
    border:1px solid var(--line);
    color:var(--dim);
    padding: 5px 10px;
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
  }
  .filterBtn.active{ color: var(--amber); border-color: var(--amber); }

  .partGrid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
    gap: 12px;
  }
  .partCard{
    background: #191a15;
    border: 1px solid var(--rarity, var(--line));
    box-shadow: inset 0 0 0 1px #000;
    padding: 10px;
    position:relative;
  }
  .partCard .tag{
    display:inline-block;
    font-size:9px;
    letter-spacing:1px;
    padding:2px 6px;
    margin-bottom:6px;
    color:#0a0a0a;
    background: var(--rarity, #999);
    font-weight:bold;
  }
  .partCard .pname{ font-size:12.5px; margin-bottom:2px; line-height:1.3; min-height: 32px;}
  .partCard .pcat{ color: var(--dim); font-size:10px; margin-bottom:6px; }
  .partCard .pval{ color: var(--good); font-size:12px; margin-bottom:8px; }
  .partCard .pcar{ color: var(--dim); font-size:9.5px; margin:-2px 0 8px 0; padding-top:6px; border-top:1px solid var(--line); letter-spacing:0.5px; }
  .partCard .pcar b{ color: var(--amber); font-weight:normal; }
  .partCard .discBadge{
    position:absolute; top:6px; right:6px; text-align:right; line-height:1.35;
    color: var(--good); font-size:9.5px; font-weight:bold; letter-spacing:0.5px;
  }
  .partCard .strike{ color: var(--dim); text-decoration: line-through; font-size:10px; margin-right:4px; }
  .partCard .demojiBig{ font-size:34px; text-align:center; margin:4px 0; }
  .cardBtns{ display:flex; gap:6px; }
  .smallBtn{
    flex:1;
    background:#242620;
    border:1px solid var(--line);
    color:var(--text);
    padding:6px 4px;
    font-family:inherit;
    font-size:10px;
    cursor:pointer;
  }
  .smallBtn:hover{ border-color: var(--amber); color: var(--amber); }
  .smallBtn.on{ color:var(--amber); border-color:var(--amber); }
  .smallBtn:disabled{ color:var(--dim); cursor:not-allowed; }
  .lockIcon{ position:absolute; top:8px; right:8px; font-size:12px; }

  .emptyMsg{ color: var(--dim); font-size: 12px; padding: 30px 0; text-align:center; }

  /* --- Market --- */
  .marketGrid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
    gap: 14px;
  }
  .listingCard{
    background:#191a15;
    border: 1px solid var(--rarity, var(--line));
    padding: 12px;
    cursor:pointer;
  }
  .listingCard:hover{ background:#20221a; }
  .listingCard .timer{ float:right; color: var(--amber); font-size:11px; }
  .listingCard .offCount{ color: var(--dim); font-size: 11px; margin-top:6px; }
  .listingCard .lcar{ color: var(--dim); font-size:10px; margin-top:2px; }
  .listingCard .lcar b{ color: var(--amber); font-weight:normal; }

  #marketSlots{ color: var(--dim); font-size: 12px; margin-bottom: 14px; }

  /* --- PARTFINDR (Market's retro search-engine front page) --- */
  .pfBrowserChrome{ background:#15160f; border:1px solid var(--line); margin-bottom:16px; }
  .pfChromeTop{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); }
  .pfNavArrows{ color:var(--dim); font-size:11px; letter-spacing:3px; user-select:none; }
  .pfUrlBar{ flex:1; background:#0d0e0a; border:1px solid var(--line); color:var(--dim); font-size:11px; padding:6px 10px; letter-spacing:0.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pfBookmarksBar{ display:flex; gap:16px; padding:6px 12px; background:#191a15; font-size:10px; letter-spacing:1px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .pfBookmarksBar span{ color:var(--dim); cursor:default; opacity:.75; }
  .pfPage{ background:#101109; min-height: 420px; padding: 4px 16px 24px; }

  .pfHome{ text-align:center; padding: 54px 16px 30px; }
  .pfLogo{ font-size:32px; letter-spacing:5px; color:var(--amber); font-weight:bold; margin-bottom:6px; display:inline-block; cursor:pointer; }
  .pfTagline{ color:var(--dim); font-size:10.5px; letter-spacing:2px; margin-bottom:26px; }
  .pfSearchWrap{ position:relative; max-width:420px; margin:0 auto 18px auto; text-align:left; }
  .pfSearchInput{ width:100%; background:#1a1c15; border:1px solid var(--line); color:var(--text); padding:12px 14px; font-family:inherit; font-size:13px; letter-spacing:0.5px; }
  .pfSearchInput:focus{ outline:none; border-color:var(--amber); }
  .pfAutofillList{ position:absolute; top:100%; left:0; right:0; background:#1e2019; border:1px solid var(--amber); border-top:none; z-index:10; display:none; max-height:220px; overflow-y:auto; }
  .pfAutofillItem{ padding:9px 14px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--line); text-align:left; }
  .pfAutofillItem:hover{ background:#262920; color:var(--amber); }
  .mktRepTag{ color: var(--repblue); font-size:11px; letter-spacing:1px; margin-bottom:16px; }
  .mktRepTag b{ font-size:13px; }
  .pfBtnRow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:6px; }
  .pfActionBtn{ background:#242620; border:1px solid var(--line); color:var(--text); padding:10px 20px; font-family:inherit; font-size:12px; letter-spacing:1px; cursor:pointer; }
  .pfActionBtn:hover{ border-color: var(--amber); color: var(--amber); }
  .pfHint{ color:var(--dim); font-size:10.5px; margin-top:22px; max-width:420px; margin-left:auto; margin-right:auto; }
  .pfRestock{ color:var(--dim); font-size:11px; margin-bottom:14px; }
  .pfNoResults{ text-align:center; padding:70px 16px; }
  .pfNoResults .big{ font-size:19px; color:var(--text); margin-bottom:10px; }
  .pfNoResults p{ color:var(--dim); font-size:12px; max-width:380px; margin:0 auto; }

  /* --- SITEFINDR (WEBSITES tab's own mock search engine) --- */
  .sfResultsHead{ padding: 20px 4px 18px; }
  .sfLogo{ font-size:22px; letter-spacing:4px; color:var(--amber); font-weight:bold; margin-bottom:6px; }
  .sfQuery{ color:var(--dim); font-size:11px; }
  .sfQuery b{ color:var(--text); }
  .sfResultsList{ display:flex; flex-direction:column; }
  .sfResult{ cursor:pointer; padding:16px 4px; border-bottom:1px solid var(--line); }
  .sfResult:last-child{ border-bottom:none; }
  .sfResult:hover{ background:#161710; }
  .sfResultTitle{ color:var(--amber); font-size:15px; font-weight:bold; margin-bottom:2px; }
  .sfResult:hover .sfResultTitle{ text-decoration:underline; }
  .sfResultUrl{ color:var(--good); font-size:11px; margin-bottom:4px; letter-spacing:0.5px; }
  .sfResultStars{ color:var(--amber); font-size:12px; letter-spacing:2px; margin-bottom:4px; }
  .sfResultDesc{ color:var(--dim); font-size:11.5px; line-height:1.4; }

  .backBtn{
    background:#1e2019;
    border:1px solid var(--line);
    color:var(--dim);
    padding: 7px 12px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:1px;
    cursor:pointer;
    margin-bottom: 16px;
  }
  .backBtn:hover{ color: var(--amber); border-color: var(--amber); }

  .detailMeta{ color: var(--dim); font-size: 12px; margin-bottom: 18px; }

  .offerRow{
    display:flex; justify-content:space-between; align-items:center;
    background:#1e2019; border:1px solid var(--line);
    padding: 10px 12px; margin-bottom:8px; font-size:12px;
  }
  .offerRow .amt{ font-size: 13px; }
  .offerRow .aboveTag{ color: var(--good); font-size:9px; letter-spacing:1px; margin-left:8px; }
  .offerBtns{ display:flex; gap:6px; }
  .acceptBtn{
    background: var(--good); border:none; color:#0a0a0a; font-weight:bold;
    padding: 6px 12px; font-family:inherit; font-size:11px; cursor:pointer;
    white-space: nowrap;
  }
  .acceptBtn:hover{ background:#84c765; }
  .declineBtn{
    background:#242620; border:1px solid var(--line); color:var(--dim);
    padding: 6px 12px; font-family:inherit; font-size:11px; cursor:pointer;
  }
  .declineBtn:hover{ border-color: var(--bad); color: var(--bad); }

  /* case opening scroll reveal */
  #scrollBg{
    position:fixed; inset:0; background: rgba(0,0,0,.92);
    display:none; align-items:center; justify-content:center; flex-direction:column; z-index: 65;
  }
  #scrollBg.show{ display:flex; }
  #scrollLabel{ color: var(--dim); font-size:12px; letter-spacing:2px; margin-bottom:16px; }
  #scrollFrame{ position:relative; width: 660px; max-width: 92vw; }
  #scrollViewport{
    width:100%; height:150px; overflow:hidden; position:relative;
    background:#0d0e0a; border:2px solid var(--amber);
    box-shadow: 0 0 30px rgba(0,0,0,.6);
  }
  #scrollTrack{
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center; gap:12px; padding: 0 12px;
  }
  .scrollCard{
    flex: 0 0 auto;
    width:110px; height:118px;
    background:#191a15;
    border: 2px solid var(--rarity, #666);
    display:flex; align-items:center; justify-content:center;
    font-size: 32px; font-weight:bold; color: var(--rarity, #666);
    position: relative;
  }
  .decalBadge{
    position:absolute; bottom:4px; left:6px; font-size:13px; color: var(--amber);
  }
  #scrollMarker{
    position:absolute; top:-12px; bottom:-12px; left:50%;
    width:2px; background: var(--amber); transform: translateX(-50%);
    box-shadow: 0 0 10px var(--amber);
  }
  #scrollMarker::before, #scrollMarker::after{
    content:''; position:absolute; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;
  }
  #scrollMarker::before{ top:-8px; border-top:9px solid var(--amber); }
  #scrollMarker::after{ bottom:-8px; border-bottom:9px solid var(--amber); }

  /* generic modal (Benefits / Install picker) */
  .modalBg{
    position:fixed; inset:0; background: rgba(0,0,0,.75);
    display:none; align-items:center; justify-content:center; z-index: 55;
  }
  .modalBg.show{ display:flex; }
  .modalBox{
    background: var(--panel);
    border: 2px solid var(--amber);
    padding: 24px;
    width: 460px;
    max-width: 92vw;
    max-height: 82vh;
    overflow-y: auto;
  }
  .modalBox h3{ margin:0 0 4px 0; color:var(--amber); font-size:15px; letter-spacing:1px; }
  .modalSub{ color: var(--dim); font-size:11px; margin-bottom:16px; }
  .upgradeRow{ background:#1e2019; border:1px solid var(--line); padding:12px; margin-bottom:10px; }
  .upgradeRow .uHead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .upgradeRow .uName{ font-size:12.5px; font-weight:bold; }
  .upgradeRow .uLevel{ color: var(--amber); font-size:11px; }
  .upgradeRow .uDesc{ color: var(--dim); font-size:10.5px; margin-bottom:8px; }
  .upgradeRow .uEffect{ color: var(--good); font-size:10.5px; margin-bottom:8px; }
  .upgradeBtn{
    width:100%; background: var(--rust); border:1px solid #7c2f1a; color:#fff;
    padding: 7px 0; font-family:inherit; font-size:11px; letter-spacing:1px; cursor:pointer;
  }
  .upgradeBtn:hover{ background:#cf5530; }
  .upgradeBtn:disabled{ background:#3a3a34; color:var(--dim); cursor:not-allowed; border-color:var(--line); }
  .closeModal{
    margin-top: 6px; width:100%; background:#242620; border:1px solid var(--line);
    color:var(--text); padding:8px; font-family:inherit; cursor:pointer;
  }
  .devGrantRow{ display:flex; gap:8px; }
  .devAmountInput{
    flex:1; background:#1a1c15; border:1px solid var(--line); color:var(--text);
    padding:7px 10px; font-family:inherit; font-size:12px;
  }
  .devAmountInput:focus{ outline:none; border-color:var(--amber); }
  .devGrantBtn{
    width:auto; padding:7px 16px; background:var(--rust); border:1px solid #7c2f1a;
    color:#fff; font-family:inherit; font-size:11px; letter-spacing:1px; cursor:pointer;
  }
  .devGrantBtn:hover{ background:#cf5530; }

  /* case pull reveal */
  #revealBg{
    position:fixed; inset:0; background: rgba(0,0,0,.9);
    display:none; align-items:center; justify-content:center; flex-direction:column; z-index: 60;
  }
  #revealBg.show{ display:flex; }
  #revealCard{
    width: 260px; padding: 26px 18px; text-align:center;
    background:#191a15; border: 3px solid var(--rarity, #999);
    box-shadow: 0 0 40px var(--rarity, #999);
    transform: scale(0.5); opacity:0;
    transition: transform .4s ease, opacity .4s ease;
  }
  #revealCard.pop{ transform: scale(1); opacity:1; }
  #revealCard .rtag{
    display:inline-block; padding:3px 10px; font-size:11px; font-weight:bold;
    letter-spacing:1px; color:#0a0a0a; background: var(--rarity,#999); margin-bottom:12px;
  }
  #revealCard .rname{ font-size:16px; margin-bottom:6px; }
  #revealCard .rcat{ color: var(--dim); font-size:11px; margin-bottom:10px; }
  #revealCard .rval{ color: var(--good); font-size:14px; }
  #revealCard .rcar{ color: var(--dim); font-size:10.5px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); letter-spacing:0.5px; }
  #revealCard .rcar b{ color: var(--amber); font-weight:normal; }
  #revealExtras{ width:260px; display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .revealExtraRow{
    display:flex; justify-content:space-between; align-items:center;
    background:#1e2019; border:1px solid var(--line); padding:7px 10px; font-size:11px;
  }
  .decalChip{
    display:flex; align-items:center; gap:10px;
    background:#1e2019; border:2px solid var(--rarity,#999); padding:8px 12px;
  }
  .decalChip .demoji{ font-size:26px; }
  .decalChip .dstars{ color: var(--amber); font-size:10.5px; margin-top:2px; }
  #revealClose{
    margin-top:20px; background: var(--rust); border:1px solid #7c2f1a; color:#fff;
    padding: 9px 22px; font-family:inherit; font-size:12px; letter-spacing:1px; cursor:pointer;
  }

  /* garage */
  .carGrid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap: 14px;
  }
  .carCard{
    background:#191a15; border:1px solid var(--line); padding: 14px; cursor:pointer;
  }
  .carCard.currentCar{ border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
  .carCard .cname{ font-weight:bold; font-size:13px; margin-bottom:4px; }
  .carCard .pwrTag{ color: var(--amber); font-weight:normal; font-size:11px; }
  .carCard .cmeta{ color:var(--dim); font-size:11px; margin-bottom:8px; }
  .potBar{ height:6px; background:#0e0f0b; margin-bottom:10px; border:1px solid var(--line);}
  .potBar div{ height:100%; background: var(--amber); }
  .carCard .cprice{ color: var(--good); font-size:13px; margin-bottom:10px; }
  .ownedTag{ color: var(--amber); font-size:11px; letter-spacing:1px; margin-bottom:8px; display:block; }

  /* workshop stage — category tabs arranged around the car */
  .pwrBanner{ color:var(--dim); font-size:11.5px; letter-spacing:0.5px; margin-bottom:10px; }
  .pwrBanner b{ color: var(--amber); font-size:13px; }
  .pwrBanner span{ color:var(--dim); }
  .workshopStage{
    position:relative; width:100%; max-width:1200px; margin:0 auto 6px auto;
    aspect-ratio: 16 / 8.4; background:#0d0e0a; border:1px solid var(--line); overflow:hidden;
  }
  .stageCarWrap{

function jsAttrEscape(s){

/* ---------------------------------------------------------
   RNG HELPERS
--------------------------------------------------------- */
function weightedIndex(weights){
  const total = weights.reduce((a,b)=>a+b,0);
  let roll = Math.random()*total;
  for(let i=0;i<weights.length;i++){
    if(roll < weights[i]) return i;
    roll -= weights[i];
  }
  return weights.length-1;
}

function weightedRarity(starIndex){
  return RARITIES[weightedIndex(WEIGHTS[starIndex])];
}

// Rolls what a purchased car actually comes with. Uses the low-biased CAR_PART_WEIGHTS
// table (not WEIGHTS), then — same "reroll and keep the better one" pattern as Case Luck —
// gives the Quality Pickings market upgrade a chance to bump each slot up to a second roll.
function weightedCarRarity(potential){
  let rarity = RARITIES[weightedIndex(CAR_PART_WEIGHTS[potential-1])];
  if(Math.random() < getQualityPickingsChance()){
    const rarity2 = RARITIES[weightedIndex(CAR_PART_WEIGHTS[potential-1])];
    if(RARITIES.indexOf(rarity2) > RARITIES.indexOf(rarity)) rarity = rarity2;
  }
  return rarity;
}

function makePart(category, rarity, carName){
  const nouns = PART_NOUNS[category];
  const noun = nouns[Math.floor(Math.random()*nouns.length)];
  const adjList = RARITY_ADJ[rarity.key];
  const adj = adjList[Math.floor(Math.random()*adjList.length)];
  const value = Math.floor(rarity.min + Math.random()*(rarity.max-rarity.min));
  // If no specific car was passed in (e.g. a case pull), the part is stamped with a
  // random model from the full CAR_MODELS pool — that's its car-specific designation.
  const car = carName || CAR_MODELS[Math.floor(Math.random()*CAR_MODELS.length)];
  return {
    id: state.nextId++,
    category,
    rarityKey: rarity.key,
    name: `${adj} ${noun}`,
    car,
    value,
    locked: false,
    listed: false,
  };
}

function makeDecal(){
  const starIdx = weightedIndex(DECAL_STAR_WEIGHTS);
  const starLevel = starIdx+1;
  const emoji = DECAL_EMOJIS[Math.floor(Math.random()*DECAL_EMOJIS.length)];
  const name = DECAL_NAMES[Math.floor(Math.random()*DECAL_NAMES.length)];
  const value = Math.floor(200*starLevel + Math.random()*300*starLevel);
  return {
    id: state.nextId++,
    kind: 'decal',
    category: 'Decals',
    name,
    emoji,
    starLevel,
    value,
    locked: false,
    listed: false,
  };
}

// Offers skew below market value more often, with an occasional above-value profit offer.
function rollOfferMultiplier(){
  if(Math.random() < 0.72){
    return 0.5 + Math.random()*0.45;   // 0.50x - 0.95x  (below value — most common)
  } else {
    return 1.05 + Math.random()*0.5;   // 1.05x - 1.55x  (above value — the rare profit offer)
  }
}

/* ---------------------------------------------------------
   WEBSITE BENEFITS — scaling math
   Every category's max effect scales with the site's star tier
   (starScale), so maxing a 1-star site's upgrade never matches
   what the same level gets you on a 5-star site.
--------------------------------------------------------- */
function starScale(stars){ return stars/5; }

function getUpgradeCost(stars, level){
  return Math.round(UPGRADE_BASE_COSTS[level] * stars);
}

function getLuckChance(site){
  return 0.30 * starScale(site.stars) * (site.upgrades.luck/5);
}
function getDiscountCount(site){
  return site.upgrades.discount;
}
// Blended scale (floor of 0.4 + up to 0.6 more from star tier) so even a 1-star site's
// level-1 Discount upgrade produces a real, visible discount instead of rounding to nothing —
// while a maxed 5-star site still caps out meaningfully higher than a maxed 1-star site.
function getDiscountMaxPct(site){
  if(site.upgrades.discount===0) return 0;
  const effScale = 0.4 + 0.6*starScale(site.stars);
  return Math.min(50, Math.round(10 * site.upgrades.discount * effScale));
}
function getBogofChance(site){
  return 0.25 * starScale(site.stars) * (site.upgrades.bogof/5);
}
function getCollectorBoost(site){
  return 0.20 * starScale(site.stars) * (site.upgrades.collector/5);
}
function getCasePrice(site, category){
  const base = CASE_COST[site.stars-1];
  const d = site.discounts.find(d=>d.category===category);
  if(d) return Math.max(10, Math.round(base * (1 - d.pct/100)));
  return base;
}

// Builds a brand-new batch of discounts for a site: one shared 5-minute cycle, each discount
// getting its own category, percentage, and a random 1-5 use limit. Called when a site first
// unlocks/upgrades the Discount benefit, and again whenever the shared cycle timer expires.
function generateDiscountBatch(site){
  const desired = getDiscountCount(site);
  const maxPct = getDiscountMaxPct(site);
  const discounts = [];
  if(desired <= 0 || maxPct < 5) return discounts;

  const catsShuffled = [...CATEGORIES].sort(()=>Math.random()-0.5);
  const usedPcts = [];
  for(let i=0; i<desired && i<catsShuffled.length; i++){
    let pct, tries=0;
    do{
      pct = 5 + Math.floor(Math.random()*(maxPct-5+1));
      tries++;
    } while(usedPcts.includes(pct) && tries<10);
    usedPcts.push(pct);
    discounts.push({
      category: catsShuffled[i],
      pct,
      usesLeft: 1 + Math.floor(Math.random()*5), // random 1-5 uses
    });
  }
  return discounts;
}

/* ---------------------------------------------------------
   CASE PULL LOGIC
--------------------------------------------------------- */
function rollLuckyRarity(site, starIdx){
  let rarity = weightedRarity(starIdx);
  if(Math.random() < getLuckChance(site)){
    const rarity2 = weightedRarity(starIdx);
    if(RARITIES.indexOf(rarity2) > RARITIES.indexOf(rarity)) rarity = rarity2;
  }
  return rarity;
}

function rollCasePull(site, category){
  const starIdx = site.stars-1;
  const mainPart = makePart(category, rollLuckyRarity(site, starIdx));

  const extraParts = [];
  if(site.upgrades.bogof > 0 && Math.random() < getBogofChance(site)){
    let itemCount = 2;
    if(site.upgrades.bogof >= 4 && Math.random() < 0.4*starScale(site.stars)) itemCount = 3;
    for(let i=1;i<itemCount;i++){
      extraParts.push(makePart(category, rollLuckyRarity(site, starIdx)));
    }
  }

  let decal = null;
  const decalChance = BASE_DECAL_CHANCE + getCollectorBoost(site);
  if(Math.random() < decalChance){
    decal = makeDecal();
  }

  return { mainPart, extraParts, decal };
}

/* ---------------------------------------------------------
   PARTFINDR — direct part search/purchase
   Every searched car keeps its own small rotating stock: 3-12 parts, random
   categories (some may repeat, some may be missing entirely), rarity rolled
   off a common-biased weight table, and a chance the whole refresh is empty.
--------------------------------------------------------- */
/* ---------------------------------------------------------
   MARKET REPUTATION — upgrade effect math
--------------------------------------------------------- */
function getHotProductBoost(){
  return 0.04 * state.market.upgrades.hotProduct; // 0%, 4%, 8%, 12%, 16%, 20% — capped at +20%
}
function getMarketDiscountCount(){
  return state.market.upgrades.discount; // level 1 = 1 discounted item, up to 5 at max
}
function getMarketDiscountMaxPct(){
  const lvl = state.market.upgrades.discount;
  if(lvl<=0) return 0;
  return Math.min(50, lvl*10); // 10%, 20%, 30%, 40%, 50% — capped at 50% off
}
function getPartfindrEmptyChance(){
  const surplus = state.market.upgrades.surplus;
  return Math.max(0.03, PARTFINDR_EMPTY_CHANCE - surplus*0.018);
}
function getPartfindrCountRange(){
  const surplus = state.market.upgrades.surplus;
  return 10 + surplus; // random range width added to the base 3 minimum
}
function getQualityPickingsChance(){
  return 0.10 * state.market.upgrades.qualityPickings; // 0%, 10%, 20%, 30%, 40%, 50% — capped at level 5
}
function getMarketRepForItem(rarityKeyOrKind, extra){
  if(rarityKeyOrKind==='decal') return MARKET_REP_BY_DECAL_STAR[extra-1] || 0;
  if(rarityKeyOrKind==='car') return MARKET_REP_BY_CAR_POTENTIAL[extra-1] || 0;
  return MARKET_REP_BY_RARITY[rarityKeyOrKind] || 0;
}

// Applies the Discount upgrade to a freshly-rolled stock batch: picks a handful of random
// items (capped by both the upgrade level and how many parts actually exist this refresh)
// and marks them down, up to the upgrade's max percentage.
function applyMarketDiscounts(items){
  const desired = getMarketDiscountCount();
  const maxPct = getMarketDiscountMaxPct();
  if(desired<=0 || maxPct<5 || items.length===0) return;
  const indices = items.map((_,i)=>i).sort(()=>Math.random()-0.5).slice(0, Math.min(desired, items.length));
  indices.forEach(i=>{
    const pct = 5 + Math.floor(Math.random()*(maxPct-5+1));
    const item = items[i];
    item.discountPct = pct;
    item.originalPrice = item.price;
    item.price = Math.max(5, Math.round(item.price * (1 - pct/100)));
  });
}

function generatePartfindrStock(carName){
  if(Math.random() < getPartfindrEmptyChance()) return [];
  const count = 3 + Math.floor(Math.random()*getPartfindrCountRange()); // widens with Surplus
  const items = [];
  for(let i=0;i<count;i++){
    const category = CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)];
    const rarity = RARITIES[weightedIndex(PARTFINDR_RARITY_WEIGHTS)];
    const part = makePart(category, rarity, carName);
    // Direct-search convenience costs a premium over the part's own value.
    const markup = 1.15 + Math.random()*0.35; // 15%-50% above value
    part.price = Math.max(part.value + 5, Math.round(part.value * markup));
    items.push(part);
  }
  applyMarketDiscounts(items);
  return items;
}

// Lazily creates a car's stock the first time it's searched, rather than pre-rolling
// stock for every car in the game up front.
function getPartfindrStock(carName){
  let stock = state.partSearchStock[carName];
  if(!stock){
    stock = { items: generatePartfindrStock(carName), timeLeft: PARTFINDR_REFRESH };
    state.partSearchStock[carName] = stock;
  }
  return stock;
}

function tickPartfindr(dt){
  Object.keys(state.partSearchStock).forEach(carName=>{
    const stock = state.partSearchStock[carName];
    stock.timeLeft -= dt;
    if(stock.timeLeft <= 0){
      stock.items = generatePartfindrStock(carName);
      stock.timeLeft = PARTFINDR_REFRESH;
    }
  });
}

/* ---------------------------------------------------------
   CARS — slots, stock parts, dynamic value
   Each car gets ONE SLOT ARRAY PER CATEGORY, sized to its build potential —
   a 1-potential car has 1 slot per category, a 5-potential car has 5.
--------------------------------------------------------- */
function initCarSlots(potential, carName){
  const slots = {};
  CATEGORIES.forEach(cat=>{
    const arr = [];
    for(let i=0;i<potential;i++){
      const rarity = weightedCarRarity(potential);
      arr.push({ part: makePart(cat, rarity, carName), installing: null });
    }
    slots[cat] = arr;
  });
  return slots;
}

// The "shell" is what the bare chassis is worth with every part stripped out — a fixed
// baseline per potential tier, independent of how lucky the stock-part rolls happen to be.
const SHELL_BASE_BY_POTENTIAL = [150, 400, 900, 1800, 3500];
function shellValueForPotential(potential){
  return SHELL_BASE_BY_POTENTIAL[potential-1];
}

function getCarValue(car){
  let total = car.shellValue;
  CATEGORIES.forEach(cat=>{
    car.slots[cat].forEach(slot=>{
      if(slot.part) total += slot.part.value;
    });
  });
  return Math.max(0, Math.round(total));
}

// POWER score: each installed part contributes points based on its rarity tier
// (Basic=10 ... Custom=70, i.e. (rarity index + 1) * 10). A maxed Build Potential 5
// car — 5 Custom-rarity parts in every one of the 8 categories — caps at 2800.
function getPartPower(rarityKey){
  const idx = RARITIES.findIndex(r=>r.key===rarityKey);
  return idx>=0 ? (idx+1)*10 : 0;
}
function getCarPower(car){
  let total = 0;
  CATEGORIES.forEach(cat=>{
    car.slots[cat].forEach(slot=>{
      if(slot.part) total += getPartPower(slot.part.rarityKey);
    });
  });
  return total;
}
function getMaxPowerForPotential(potential){
  return potential * CATEGORIES.length * 70;
}

function getItemValue(l, item){
  return l.type==='car' ? getCarValue(item) : item.value;
}

// Average value of a single rarity roll off a given weight row (aligned to RARITIES order).
function expectedSlotValue(weights){
  const total = weights.reduce((a,b)=>a+b,0);
  const sum = RARITIES.reduce((acc,r,i)=> acc + weights[i]*((r.min+r.max)/2), 0);
  return sum / total;
}

// What a fully-optioned example of this build-potential tier is statistically worth, using
// the ORIGINAL case-pull weight table — this is the "build potential" the price tag reflects,
// deliberately independent of CAR_PART_WEIGHTS/what actually gets rolled into the listing.
function expectedPartsValueForPotential(potential){
  return expectedSlotValue(WEIGHTS[potential-1]) * CATEGORIES.length * potential;
}

// Rolls a complete car build (shell + stock parts) up front. The sticker price is based on
// the car's build potential — what buyers are really paying for — not on the actual parts
// this particular listing happened to roll (those use CAR_PART_WEIGHTS and skew low), so a
// high-end car reliably prices high while its resale value right after purchase takes a real
// hit unless you got lucky or leveled up Quality Pickings.
function rollCarBuild(potential, carName){
  const slots = initCarSlots(potential, carName);
  const shellValue = shellValueForPotential(potential);
  const trueValue = shellValue + expectedPartsValueForPotential(potential);
  const dealerMargin = 1.08 + Math.random()*0.22; // dealer marks up 8%-30% over the build-potential ceiling
  const price = Math.max(shellValue, Math.round((trueValue * dealerMargin) / 25) * 25);
  return { slots, shellValue, price };
}

function generateDealerListings(count){
  const pool = [...CAR_POOL];
  const picks = [];
  for(let i=0;i<count && pool.length>0;i++){
    const idx = Math.floor(Math.random()*pool.length);
    const m = pool.splice(idx,1)[0];
    const build = rollCarBuild(m.potential, m.name);
    picks.push({
      id: state.nextId++,
      name: m.name,
      potential: m.potential,
      bodyStyle: m.bodyStyle,
      price: build.price,
      shellValue: build.shellValue,
      slots: build.slots,
    });
  }
  return picks;
}

  });
  render();
}
document.querySelectorAll('.navbtn').forEach(b=>{
  b.addEventListener('click', ()=>setTab(b.dataset.tab));
});

function render(){
  renderTopbar();
  if(state.activeTab==='websites') renderWebsites();
  else if(state.activeTab==='inventory') renderInventory();
  else if(state.activeTab==='market') renderMarket();
  else if(state.activeTab==='garage') renderGarage();
  else if(state.activeTab==='race') renderRace();
}

function renderDiscountTimerTag(site){
  if(site.upgrades.discount===0) return '';
  const label = site.discounts.length>0 ? 'Refresh in' : 'Discounts in';
  const mins = Math.floor(site.discountTimeLeft/60);
  const secs = Math.floor(site.discountTimeLeft%60).toString().padStart(2,'0');
  return `<span class="discountTimerTag">${label}: ${mins}:${secs}</span>`;
}

function renderAutoExchangePage(){

function renderInventory(){

    <button class="filterBtn ${state.invCarFilter==='All'?'active':''}" onclick="setInvCarFilter('All')">ALL MODELS</button>`;

        html += `<div class="partCard" style="--rarity:${color}">
          ${p.locked?'<div class="lockIcon">🔒</div>':''}
          <div class="tag">DECAL ${'★'.repeat(p.starLevel)}</div>
          <div class="demojiBig">${p.emoji}</div>
          <div class="pname" style="text-align:center;">${p.name}</div>

          <div class="pval" style="text-align:center;">$${p.value.toLocaleString()}</div>
          <div class="cardBtns">
            <button class="smallBtn ${p.locked?'on':''}" onclick="toggleLock(${p.id})">${p.locked?'UNLOCK':'LOCK'}</button>
            <button class="smallBtn" ${(canList)?'':'disabled'} onclick="listForSale(${p.id})">${p.listed?'LISTED':'LIST FOR SALE'}</button>
          </div>
        </div>`;
      } else {
        const r = rarityByKey(p.rarityKey);
        const fitsOwnedCar = state.cars.some(c=>c.name===p.car);
        html += `<div class="partCard" style="--rarity:${r.color}">
          ${p.locked?'<div class="lockIcon">🔒</div>':''}
          <div class="tag">${r.name}</div>
          <div class="pname">${p.name}</div>
          <div class="pcat">${p.category}</div>
          <div class="pval">$${p.value.toLocaleString()}</div>
          <div class="pcar" style="${fitsOwnedCar?'color:var(--good);':''}">FITS: <b>${p.car}</b>${fitsOwnedCar?' ✓':''}</div>
          <div class="cardBtns">
            <button class="smallBtn ${p.locked?'on':''}" onclick="toggleLock(${p.id})">${p.locked?'UNLOCK':'LOCK'}</button>
            <button class="smallBtn" ${(canList)?'':'disabled'} onclick="listForSale(${p.id})">${p.listed?'LISTED':'LIST FOR SALE'}</button>
          </div>
        </div>`;

    });

function setInvCarFilter(m){ state.invCarFilter = m; render(); }



function getListingItem(l){
  return l.type==='car' ? state.cars.find(c=>c.id===l.refId) : state.inventory.find(p=>p.id===l.refId);

function renderMarket(){
  if(state.market.view === 'listings'){

/* ---------------------------------------------------------
   PARTFINDR — retro browser chrome shared across all views
--------------------------------------------------------- */
function slugify(s){
  return String(s).toLowerCase().replace(/'/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function partfindrUrl(){
  if(state.market.view==='results') return `partfindr.net/search?car=${slugify(state.market.resultsCar||'')}`;
  if(state.market.view==='noresults') return `partfindr.net/search?car=${slugify(state.market.lastQuery||'')}`;
  if(state.market.view==='listings') return `partfindr.net/account/listings`;
  return 'partfindr.net/';
}

// Decorative, unclickable bookmark-bar text — varies a little by page "type" so every
// mock website doesn't read as an identical reskin of the same search engine.
const BOOKMARKS_SEARCH = ['★ Home','Bookmarks','History','Downloads','Settings','Help'];
const BOOKMARKS_SHOP = ['Deals','Reviews','Track Order','Support'];
const BOOKMARKS_DEALER = ['Inventory','Financing','Trade-In','Support'];
const BOOKMARKS_ACCOUNT = ['Orders','Messages','Settings','Help'];

// Shared "browser window" shell: nav arrows + URL bar + bookmarks bar, all wrapping the
// actual page content in one rectangle — reused by both PARTFINDR and the WEBSITES tab.
// opts.devSettings makes the "Settings" bookmark a hidden trigger for the dev console —
// it stays visually identical to the other decorative bookmark text either way.
function browserFrame(url, bodyHtml, bookmarks, opts){
  const marks = bookmarks || BOOKMARKS_SEARCH;
  const devSettings = opts && opts.devSettings;
  const marksHtml = marks.map(m=>{
    if(devSettings && m==='Settings') return `<span ondblclick="openDevConsolePrompt()">${m}</span>`;
    return `<span>${m}</span>`;
  }).join('');
  return `<div class="pfBrowserChrome">
    <div class="pfChromeTop">
      <span class="pfNavArrows">◀ ▶ ⟳</span>
      <div class="pfUrlBar">${url}</div>
    </div>
    <div class="pfBookmarksBar">${marksHtml}</div>
    <div class="pfPage">${bodyHtml}</div>
  </div>`;
}
function pfFrame(bodyHtml, bookmarks){
  return browserFrame(partfindrUrl(), bodyHtml, bookmarks);
}

function renderPartfindrResults(){

  const discountedCount = stock.items.filter(p=>p.discountPct).length;
  body += `<p class="pfRestock">Stock refreshes in ${mins}:${secs} · prices run above market value for direct-search convenience${discountedCount>0 ? ` · ${discountedCount} discounted item${discountedCount!==1?'s':''} this refresh` : ''}</p>`;

  body += `<div class="invFilters">`;

  });

  if(stock.items.length===0){
    body += `<div class="emptyMsg">No sellers currently listing parts for the ${carName}. Check back after the next refresh.</div>`;
  } else if(shown.length===0){
    body += `<div class="emptyMsg">No ${state.market.resultsFilter} parts in this refresh. Try another category or check back later.</div>`;
  } else {
    body += `<div class="partGrid">`;
    shown.forEach(p=>{

        ? `<span class="strike">$${p.originalPrice.toLocaleString()}</span>$${p.price.toLocaleString()}`
        : `$${p.price.toLocaleString()}`;

function renderYourListings(){
  let body = `<button class="backBtn" onclick="backToPartfindr()">← BACK TO PARTFINDR</button>`;
  body += `<h2 class="pagetitle">YOUR LISTINGS</h2><p class="pagesub">Listings run for 5 minutes and attract random offers. Open a listing to accept or decline offers.</p>`;
  body += `<div class="mktRepTag">MARKET REP <b>${state.market.reputation.toLocaleString()}</b></div>`;
  body += `<div id="marketSlots">SLOTS USED: ${state.listings.length} / 5</div>`;

  if(state.listings.length===0){
    body += `<div class="emptyMsg">No active listings. List a part or car from PART INVENTORY / GARAGE.</div>`;
  } else {
    body += `<div class="marketGrid">`;
    state.listings.forEach(l=>{
      const item = getListingItem(l);
      if(!item) return;
      const value = getItemValue(l, item);
      const mins = Math.floor(l.timeLeft/60);
      const secs = Math.floor(l.timeLeft%60).toString().padStart(2,'0');
      let color, tagLabel, subLine, carLine = '';
      if(l.type==='car'){
        color = '#f2b705'; tagLabel = 'CAR';
        subLine = `Build Potential ${item.potential}/5 · est. $${value.toLocaleString()}`;
      } else if(item.kind==='decal'){
        color = DECAL_STAR_COLORS[item.starLevel-1]; tagLabel = 'DECAL';
        subLine = `${'★'.repeat(item.starLevel)} collector item · est. $${value.toLocaleString()}`;
      } else {
        const r = rarityByKey(item.rarityKey);
        color = r.color; tagLabel = r.name;
        subLine = `${item.category} · est. $${value.toLocaleString()}`;
        carLine = `<div class="lcar">FITS: <b>${item.car}</b></div>`;
      }
      body += `<div class="listingCard" style="--rarity:${color}" onclick="openMarketDetail(${l.id})">
        <span class="timer">${mins}:${secs}</span>

function renderMarketDetail(listingId){
  const l = state.listings.find(l=>l.id===listingId);
  if(!l){ state.marketDetailId = null; renderMarket(); return; }
  const item = getListingItem(l);
  if(!item){ state.marketDetailId = null; renderMarket(); return; }

  const value = getItemValue(l, item);
  const mins = Math.floor(l.timeLeft/60);
  const secs = Math.floor(l.timeLeft%60).toString().padStart(2,'0');
  let color, metaLine;
  if(l.type==='car'){
    color = '#f2b705';
    metaLine = `Build Potential ${item.potential}/5 · Est. value $${value.toLocaleString()} (includes installed parts) · Listing closes in ${mins}:${secs}`;
  } else if(item.kind==='decal'){
    color = DECAL_STAR_COLORS[item.starLevel-1];
    metaLine = `${'★'.repeat(item.starLevel)} Decal · Est. value $${value.toLocaleString()} · Listing closes in ${mins}:${secs}`;
  } else {
    const r = rarityByKey(item.rarityKey);
    color = r.color;
    metaLine = `${item.category} · ${r.name} · Fits: ${item.car} · Est. value $${value.toLocaleString()} · Listing closes in ${mins}:${secs}`;
  }

  let html = `<button class="backBtn" onclick="closeMarketDetail()">← BACK TO MARKET</button>`;
  html += `<h2 class="pagetitle" style="color:${color}">${item.name.toUpperCase()}</h2>`;
  html += `<div class="detailMeta">${metaLine}</div>`;

  if(l.offers.length===0){
    html += `<div class="emptyMsg">No offers yet. Check back soon.</div>`;
  } else {
    l.offers.slice().sort((a,b)=>b.amount-a.amount).forEach(o=>{
      const aboveMarket = o.amount > value;
      html += `<div class="offerRow">
        <span class="amt">${o.buyer} — $${o.amount.toLocaleString()}${aboveMarket?'<span class="aboveTag">ABOVE VALUE</span>':''}</span>
        <span class="offerBtns">
          <button class="acceptBtn" onclick="acceptOffer(${l.id}, ${o.id})">ACCEPT</button>
          <button class="declineBtn" onclick="declineOffer(${l.id}, ${o.id})">DECLINE</button>
        </span>
      </div>`;
    });
  }
  content.innerHTML = html;
}

function renderWorkshop(car){
  let html = `<button class="backBtn" onclick="closeWorkshop()">← BACK TO GARAGE</button>`;
  html += `<h2 class="pagetitle">${car.name.toUpperCase()} — WORKSHOP</h2>`;
  html += `<p class="pagesub">Est. value with current build: $${getCarValue(car).toLocaleString()} (bare shell worth $${car.shellValue.toLocaleString()}). Build Potential ${car.potential} gives this car ${car.potential} slot(s) per category. Select a category below to view its slots.</p>`;

  html += `<div class="slotPanel">`;
  if(workshopActiveCategory && car.slots[workshopActiveCategory]){
    const cat = workshopActiveCategory;
    const slotsArr = car.slots[cat];
    const filled = slotsArr.filter(s=>s.part).length;
    html += `<div class="slotPanelHead">${cat.toUpperCase()} — ${filled}/${slotsArr.length} INSTALLED</div>`;
    html += `<div class="slotPanelGrid">`;
    slotsArr.forEach((slot, idx)=>{
      if(slot.installing){
        const mins = Math.floor(slot.installing.timeLeft/60);
        const secs = Math.floor(slot.installing.timeLeft%60).toString().padStart(2,'0');
        html += `<div class="slotCardFlat installing">
          <div class="slotInstalling">INSTALLING…<br>${mins}:${secs}</div>
        </div>`;
      } else if(slot.part){
        const r = rarityByKey(slot.part.rarityKey);
        html += `<div class="slotCardFlat" style="--rarity:${r.color}">
          <button class="slotRemove" onclick="uninstallPart(${car.id}, '${cat}', ${idx})">×</button>
          <div class="tag">${r.name}</div>
          <div class="pname">${slot.part.name}</div>
          <div class="pval">$${slot.part.value.toLocaleString()}</div>
          <div class="scar">FITS: <b>${slot.part.car}</b></div>
        </div>`;
      } else {
        html += `<div class="slotCardFlat empty" onclick="openInstallPicker(${car.id}, '${cat}', ${idx})">
          <div class="slotEmptyLabel">+ EMPTY SLOT</div>
        </div>`;
      }
    });
    html += `</div>`;
  } else {
    html += `<div class="emptyMsg">Select a part category below to view and edit its slots.</div>`;
  }
  html += `</div>`;

  html += `<div class="pwrBanner">POWER SCORE: <b>${getCarPower(car)}</b> <span>(max for this potential: ${getMaxPowerForPotential(car.potential)})</span></div>`;
  html += `<div class="workshopStage">`;
  html += `<div class="stageCarWrap">${getCarSvg(car)}</div>`;

  WORKSHOP_LAYOUT.forEach(pos=>{
    const cat = pos.cat;
    const slotsArr = car.slots[cat];
    const filled = slotsArr.filter(s=>s.part).length;
    const installing = slotsArr.filter(s=>s.installing).length;
    const active = workshopActiveCategory===cat;
    html += `<div class="categoryTab ${active?'active':''}" style="left:${pos.x}%;top:${pos.y}%;" onclick="selectWorkshopCategory('${cat}')">
      <div class="tabName">${cat}</div>
      <div class="tabCount">${filled}/${slotsArr.length}${installing?` · ${installing} inst.`:''}</div>
    </div>`;
  });

  html += `</div>`;
  content.innerHTML = html;
}

--------------------------------------------------------- */
function buyCase(siteIdx, category){
  const site = WEBSITES[siteIdx];
  const price = getCasePrice(site, category);
  if(state.cash < price) return;
  state.cash -= price;

  // Buying a discounted case only spends one of its uses — it does NOT reroll the
  // discount batch or reset the shared refresh timer. Only running out of uses (or
  // the shared timer expiring) removes/rerolls a discount.
  const dIdx = site.discounts.findIndex(d=>d.category===category);
  if(dIdx !== -1){
    site.discounts[dIdx].usesLeft -= 1;
    if(site.discounts[dIdx].usesLeft <= 0){
      site.discounts.splice(dIdx,1);
    }
  }

  site.reputation += Math.round(10*site.stars);

  const result = rollCasePull(site, category);
  state.inventory.push(result.mainPart);
  result.extraParts.forEach(p=>state.inventory.push(p));
  if(result.decal) state.inventory.push(result.decal);

  render();
  startCaseScroll(result);
}

function buyDealerCar(siteIdx, carId){
  const site = WEBSITES[siteIdx];
  const idx = site.listings.findIndex(c=>c.id===carId);
  if(idx===-1) return;
  const c = site.listings[idx];
  if(state.cash < c.price) return;
  state.cash -= c.price;
  site.listings.splice(idx,1);
  state.cars.push({
    id: state.nextId++,
    name: c.name,
    potential: c.potential,
    bodyStyle: c.bodyStyle,
    color: CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)],
    currentProject: state.cars.length===0,
    listed: false,
    shellValue: c.shellValue,
    slots: c.slots, // exact same build shown on the lot — the price you paid already reflects this
  });
  render();
  showToast(`Acquired ${c.name}!`);
}

/* --- Case-opening horizontal scroll reveal --- */
function startCaseScroll(result){
  const track = document.getElementById('scrollTrack');
  const bg = document.getElementById('scrollBg');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0px)';

  const cardW = 110, gap = 12, step = cardW + gap;
  const totalCards = 36;
  const winIndex = 28; // land near the end so there's a long scroll to slow down through
  const winRarity = rarityByKey(result.mainPart.rarityKey);

  for(let i=0;i<totalCards;i++){
    const card = document.createElement('div');
    card.className = 'scrollCard';
    if(i===winIndex){
      card.style.setProperty('--rarity', winRarity.color);
      card.textContent = '?';
      if(result.decal){
        const badge = document.createElement('span');
        badge.className = 'decalBadge';
        badge.textContent = '★';
        card.appendChild(badge);
      }
    } else {
      const r = RARITIES[Math.floor(Math.random()*RARITIES.length)];
      card.style.setProperty('--rarity', r.color);
      card.textContent = '?';
    }
    track.appendChild(card);
  }

  bg.classList.add('show');

  requestAnimationFrame(()=>{
    const viewportW = document.getElementById('scrollViewport').clientWidth;
    const target = -(winIndex*step + cardW/2 - viewportW/2);
    requestAnimationFrame(()=>{
      track.style.transition = 'transform 4.2s cubic-bezier(0.1,0.7,0.15,1)';
      track.style.transform = `translateX(${target}px)`;
    });
  });

  track.addEventListener('transitionend', function onDone(){
    track.removeEventListener('transitionend', onDone);
    bg.classList.remove('show');
    showRevealResult(result);
  }, { once:true });
}

function showReveal(part){
  const r = rarityByKey(part.rarityKey);
  const bg = document.getElementById('revealBg');
  const card = document.getElementById('revealCard');
  card.style.setProperty('--rarity', r.color);
  document.getElementById('revTag').textContent = r.name.toUpperCase();
  document.getElementById('revTag').style.background = r.color;
  document.getElementById('revName').textContent = part.name;
  document.getElementById('revCat').textContent = part.category;
  document.getElementById('revVal').textContent = 'Est. Value $'+part.value.toLocaleString();
  document.getElementById('revCar').innerHTML = 'FITS: <b>'+part.car+'</b>';
  bg.classList.add('show');
  card.classList.remove('pop');
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('pop')));
}

function showRevealResult(result){
  showReveal(result.mainPart);
  const extras = document.getElementById('revealExtras');
  let html = '';
  result.extraParts.forEach(p=>{
    const r = rarityByKey(p.rarityKey);
    html += `<div class="revealExtraRow"><span style="color:${r.color}">BONUS · ${r.name}</span><span>${p.name} — $${p.value.toLocaleString()}<br><span style="color:var(--dim);font-size:10px;">FITS: ${p.car}</span></span></div>`;
  });
  if(result.decal){
    const d = result.decal;
    html += `<div class="decalChip" style="--rarity:${DECAL_STAR_COLORS[d.starLevel-1]}">
      <span class="demoji">${d.emoji}</span>
      <span>
        <div>${d.name}</div>
        <div class="dstars">${'★'.repeat(d.starLevel)}${'☆'.repeat(5-d.starLevel)} DECAL · $${d.value.toLocaleString()}</div>
      </span>
    </div>`;
  }
  extras.innerHTML = html;
}

function renderInstallPicker(){
  const { carId, category } = installPicker;
  const car = state.cars.find(c=>c.id===carId);
  document.getElementById('installModalTitle').textContent = `INSTALL — ${category.toUpperCase()}`;

  const categoryMatches = state.inventory.filter(p => p.category===category && p.kind!=='decal' && !p.listed);
  const eligible = categoryMatches.filter(p => p.car === car.name);
  const incompatibleCount = categoryMatches.length - eligible.length;

  let sub = `${eligible.length} compatible part(s) for ${car.name}`;
  if(incompatibleCount > 0) sub += ` · ${incompatibleCount} in inventory won't fit this model`;
  document.getElementById('installModalSub').textContent = sub;

  let html = '';
  if(eligible.length===0){
    html = `<div class="emptyMsg">No ${category} parts in inventory fit the ${car.name}.${incompatibleCount>0?` (${incompatibleCount} on hand fit other models.)`:''}</div>`;
  } else {
    eligible.forEach(p=>{
      const r = rarityByKey(p.rarityKey);
      const time = INSTALL_TIME_BY_RARITY[r.key];
      const timeLabel = `${Math.floor(time/60)}m ${time%60}s`;
      html += `<div class="offerRow">
        <span class="amt" style="color:${r.color};min-width:90px;">${r.name}</span>
        <span style="flex:1;margin:0 10px;">${p.name} — $${p.value.toLocaleString()}<br><span style="color:var(--dim);font-size:10px;">FITS: ${p.car}</span></span>
        <button class="acceptBtn" onclick="startInstall(${installPicker.carId}, '${category}', ${installPicker.slotIndex}, ${p.id})">INSTALL (${timeLabel})</button>
      </div>`;
    });
  }
  document.getElementById('installModalBody').innerHTML = html;
}

function startInstall(carId, category, slotIndex, partId){
  const car = state.cars.find(c=>c.id===carId);
  if(!car) return;
  const slotsArr = car.slots[category];
  const slot = slotsArr && slotsArr[slotIndex];
  if(!slot || slot.part || slot.installing) return;
  const idx = state.inventory.findIndex(p=>p.id===partId);
  if(idx===-1) return;
  const part = state.inventory[idx];
  if(part.category !== category || part.listed || part.car !== car.name) return;

  state.inventory.splice(idx,1);
  const rarity = rarityByKey(part.rarityKey);
  const time = INSTALL_TIME_BY_RARITY[rarity.key];
  slot.installing = { part, timeLeft: time, totalTime: time };

  closeInstallPicker();
  render();
}

function uninstallPart(carId, category, slotIndex){
  const car = state.cars.find(c=>c.id===carId);
  if(!car) return;
  const slotsArr = car.slots[category];
  const slot = slotsArr && slotsArr[slotIndex];
  if(!slot || !slot.part) return;
  state.inventory.push(slot.part);
  slot.part = null;
  render();
}

function showToast(msg){

  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>{ t.style.display='none'; }, 2200);
}

  const site = WEBSITES[benefitsSiteIdx];
  const level = site.upgrades[key];
  if(level >= 5) return;
  const cost = getUpgradeCost(site.stars, level);
  if(site.reputation < cost) return;
  site.reputation -= cost;
  site.upgrades[key] = level+1;

    site.discountTimeLeft = 300;

  renderBenefits();

function pfHandleInput(value){
